    /* Sidebar: name, search, theme control, task groups */
    .app-name-link::before {

    .theme-toggle {
      order: 1;
      display: block;
      width: 100%;
      margin: 8px 0 0;

      font: inherit;
      font-size: 14px;
      line-height: 20px;

    .sidebar-nav { font-size: 14px; line-height: 20px; }
    .sidebar-nav li, .sidebar-nav li a { overflow: visible; white-space: normal; text-overflow: clip; }

    .markdown-section { padding: 40px 24px; margin: 0; }
    .markdown-section h1 { line-height: 40px; }

    /* Code: one surface, one border, Copy always visible; synopsis (text) blocks get no Copy */
    .markdown-section pre[data-lang] { border: 1px solid var(--line); background: var(--surface); }
    .markdown-section pre[data-lang]::after { content: none; }
    .markdown-section pre[data-lang] code { padding-right: 72px; }
    .markdown-section pre > code { white-space: pre; }
    .markdown-section .docsify-copy-code-button {

    .markdown-section pre[data-lang="text"] .docsify-copy-code-button { display: none; }
    .markdown-section pre[data-lang="text"] code { padding-right: 16px; }

    .table-wrap { overflow-x: auto; margin: 16px 0; }
    .markdown-section table { display: table; width: 100%; margin: 0; }
    .markdown-section th, .markdown-section td { vertical-align: top; }

    /* Page contents: fixed 200px column above 1280px, in-flow block at the top otherwise */
    .toc-nav { font-size: 14px; line-height: 20px; }
    .toc-nav.nothing { display: none; }
    .toc-nav::before { content: "On this page"; display: block; font-weight: 600; margin-bottom: 8px; }

    .toc-nav .lv3 { display: none; }

      .content { padding-right: 200px; }
      .toc-nav {
        position: fixed;
        top: 0;
        right: 0;
        width: 200px;
        height: 100vh;
        overflow-y: auto;
        padding: 80px 16px 24px;
        border-left: 1px solid var(--line);
        background: var(--bg);
        z-index: 10;
      }
      .toc-nav .page_toc { display: block; }
      .toc-nav .page_toc > div { margin: 0 0 4px; }
      .toc-nav .lv3 { display: block; padding-left: 12px; }
      .toc-nav a { display: block; text-decoration: none; padding-left: 10px; border-left: 2px solid transparent; }
      .toc-nav a:hover { text-decoration: underline; }
      .toc-nav .active > a { border-left-color: var(--accent); font-weight: 600; }
    }

    /* Diagrams */
    .mermaid { display: flex; justify-content: center; margin: 24px 0; width: 100%; }
    .mermaid svg { max-width: 100%; height: auto; }

    @media (max-width: 47.99em) {
      :root { --sidebar-padding: 0 16px; }
      .markdown-section { padding: 64px 16px 24px; }
      .toc-nav { padding: 64px 16px 16px; }
      .markdown-section pre[data-lang]:not([data-lang="text"]) code { padding-top: 40px; }
      .toc-nav + .markdown-section { padding-top: 16px; }
      .mermaid { overflow-x: auto; justify-content: flex-start; }
      .mermaid svg { max-width: none; min-width: var(--mmd-natural-width, 100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { transition: none !important; animation: none !important; }
    }
    @media print {
      :root, :root[data-theme="dark"] { --bg: #fff; --fg: #000; --accent: #000; --surface: #fff; --line: #000; --muted: #000; }
      .sidebar, .sidebar-toggle, .toc-nav, .github-corner, .docsify-copy-code-button, .theme-toggle { display: none !important; }
      .sidebar + .content, .content { margin-left: 0; padding-right: 0; }
      .markdown-section { max-width: none; padding: 0; }
      .markdown-section pre[data-lang] code, .markdown-section pre > code { white-space: pre-wrap; word-break: break-word; overflow: visible; }
      .table-wrap { overflow: visible; }
    }
  </style>

      copyCode: { buttonText: 'Copy', successText: 'Copied' },
      markdown: {

            if (lang === 'mermaid') {

              return '<div class="mermaid">' + escaped + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
    };
  </script>

  <script>
    function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
    function setTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = mode === 'dark' ? 'Use light theme' : 'Use dark theme';
    }
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'light' || stored === 'dark' || !window.matchMedia) return;
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var chosen = null;
        try { chosen = localStorage.getItem('theme'); } catch (err) {}
        if (chosen === 'light' || chosen === 'dark') return;
        setTheme(e.matches ? 'dark' : 'light'); rerenderMermaid();
      });
    })();

    mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'default' });
    window._mermaidSources = {};
    function rerenderMermaid() {
      mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'default' });
      document.querySelectorAll('.mermaid').forEach(function (el) {
        var id = el.getAttribute('data-mermaid-id');
        if (id && window._mermaidSources[id]) el.textContent = window._mermaidSources[id];
        el.removeAttribute('data-processed');
        el.innerHTML = el.textContent;
      });
      mermaid.run({ querySelector: '.mermaid' }).then(function () {
        document.querySelectorAll('.mermaid svg').forEach(function (svg) {
          if (svg.style.maxWidth) svg.style.setProperty('--mmd-natural-width', svg.style.maxWidth);
        });
      });
    }
    function initMermaid(hook) {
      hook.doneEach(function () {
        document.querySelectorAll('.mermaid').forEach(function (el, i) {
          var id = 'mmd-' + i;
          el.setAttribute('data-mermaid-id', id);
          window._mermaidSources[id] = el.textContent;
        });
        rerenderMermaid();
      });
    }
    function initThemeToggle(hook) {
      hook.mounted(function () {
        var sidebar = document.querySelector('.sidebar');
        if (!sidebar || document.getElementById('theme-toggle')) return;
        var btn = document.createElement('button');
        btn.id = 'theme-toggle'; btn.type = 'button'; btn.className = 'theme-toggle';
        var search = sidebar.querySelector('.search');
        if (search) search.insertAdjacentElement('afterend', btn);
        else sidebar.insertBefore(btn, sidebar.querySelector('.sidebar-nav'));
        btn.addEventListener('click', function () {
          var next = isDark() ? 'light' : 'dark';
          try { localStorage.setItem('theme', next); } catch (e) {}
          setTheme(next);
          rerenderMermaid();
        });
        setTheme(isDark() ? 'dark' : 'light');
      });
    }
    function initHomeActive(hook) {
      hook.doneEach(function () {
        var hash = window.location.hash;
        var isHome = !hash || hash === '#' || hash === '#/' || hash === '#/?id=';
        document.querySelectorAll('.sidebar-nav a').forEach(function (a) {
          var href = a.getAttribute('href');
          if (href === '#/' || href === '#' || href === '/') {
            var li = a.closest('li');
            if (li) li.classList.toggle('active', isHome);
          }
        });
      });
    }
    function updateTitle(hook) {
      hook.doneEach(function () {
        var h1 = document.querySelector('.markdown-section h1');
        var base = 'splunkctl';
        var page = h1 ? h1.textContent.trim() : '';
        document.title = (page && page !== base) ? page + ' — ' + base : base + ' — Splunk MCP Server and CLI for SIEM and SOAR';
      });
    }
    function wrapTables(hook) {
      hook.doneEach(function () {
        document.querySelectorAll('.markdown-section table').forEach(function (t) {
          if (t.parentElement.classList.contains('table-wrap')) return;
          var wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          t.parentNode.insertBefore(wrap, t);
          wrap.appendChild(t);
        });
      });
    }
    function markSafety(hook) {
      hook.doneEach(function () {
        document.querySelectorAll('.markdown-section blockquote').forEach(function (q) {
          var label = q.querySelector(':scope > p:first-child > strong:first-child');
          if (label && /^safety\b/i.test(label.textContent.trim())) q.classList.add('safety');
        });
      });
    }
    window.$docsify = window.$docsify || {};
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(initMermaid, initThemeToggle, initHomeActive, updateTitle, wrapTables, markSafety);
  </script>
</body>
</html>
