    :root[data-theme="light"] .sidebar .search input[type=search] {
      color: #1f2328;

    :root[data-theme="light"] .sidebar .search input[type=search]::placeholder {

      content: "█";
      color: var(--accent);
      animation: blink 1.1s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* bottom-right controls */
    .sidebar-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      display: flex;
      gap: 0;
      border-radius: 8px;

      color: var(--base-color);
      background: var(--sidebar-background);

      border-right: 1px solid var(--border);

      display: inline-flex;

      justify-content: center;
      transition: background .15s, color .15s;

    .sidebar-controls button:last-child {
      border-right: none;
    }
    .sidebar-controls button:hover {
      background: var(--base-background-color);
      color: var(--accent);
    }

      border-collapse: collapse;
      width: 100%;
      display: table;
    }
    .markdown-section th {
      background: var(--table-head-background);
      color: var(--heading-color);
      font-weight: 700;
      border: 1px solid var(--table-cell-border-color);

    .markdown-section td {
      border: 1px solid var(--table-cell-border-color);
      padding: 8px 12px;
      color: var(--base-color);
    }
    .markdown-section tr:nth-child(even) td {
      background: var(--table-row-even-background);
    }
    .markdown-section tr:nth-child(odd) td {
      background: var(--base-background-color);
    }

    /* wider sidebar, no text truncation */
    :root {
      --sidebar-width: 280px;
    }
    .sidebar-nav li a {
      overflow: visible;
      white-space: normal;
      text-overflow: unset;
    }
    .sidebar-nav li {
      overflow: visible;
    }
    .sidebar {
      overflow-x: hidden;
    }
    .sidebar-nav {
      margin-top: 8px;
    }

    /* right sidebar TOC */
    .page_toc {
      position: fixed;
      top: 0;
      right: 0;
      width: 200px;
      height: 100vh;
      overflow-y: auto;
      padding: 60px 16px 20px 16px;
      border-left: 1px solid var(--border);
      background: var(--base-background-color);
      z-index: 10;
      box-sizing: border-box;
    }
    .page_toc a {
      font-family: var(--base-font-family);
      font-size: 13px;
      line-height: 1.6;
      padding: 3px 0 3px 12px;
      border-left: 2px solid var(--border);
      color: var(--muted) !important;
      text-decoration: none !important;
      display: block;
      transition: color .15s, border-color .15s;
    }
    .page_toc a:hover,
    .page_toc a.active {
      color: var(--accent) !important;
      border-left-color: var(--accent);
    }
    .page_toc .lv3 a,
    .page_toc a[data-level="3"] {
      padding-left: 24px;
      font-size: 12px;
    }
    .page_toc.hidden,
    .toc-hidden .page_toc {
      display: none;
    }
    @media (max-width: 1100px) {
      .page_toc { display: none; }
      #toc-toggle { display: none; }
    }

    /* center mermaid diagrams */
    .mermaid {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 24px auto;
      width: 100%;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* scrollable tables */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 16px 0;
    }
    .table-wrap table {
      margin: 0;
    }

    /* scrollable code blocks */
    .markdown-section pre {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section pre > code {
      white-space: pre;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--sb-thumb); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* mobile: wide diagrams scroll horizontally instead of shrinking */
    @media (max-width: 768px) {
      .mermaid {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
      }
      .mermaid svg {
        max-width: none !important;
        min-width: var(--mmd-natural-width, 100%);
      }
    }
  </style>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: document.documentElement.getAttribute('data-theme') !== 'light' ? 'dark' : 'default' });
    window._mermaidSources = {};
    function rerenderMermaid() {
      var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default' });
      document.querySelectorAll('.mermaid').forEach(function (el) {
        var id = el.getAttribute('data-mermaid-id');
        if (id && window._mermaidSources[id]) {
          el.textContent = window._mermaidSources[id];
        }
        el.removeAttribute('data-processed');
        el.innerHTML = el.textContent;
      });
      mermaid.run({ querySelector: '.mermaid' }).then(function () {
        document.querySelectorAll('.mermaid svg').forEach(function (svg) {
          if (svg.style.maxWidth) svg.style.setProperty('--mmd-natural-width', svg.style.maxWidth);
        });
      });
    }
    function initMermaid(hook) {
      hook.doneEach(function () {
        document.querySelectorAll('.mermaid').forEach(function (el, i) {
          var id = 'mmd-' + i;
          el.setAttribute('data-mermaid-id', id);
          window._mermaidSources[id] = el.textContent;
        });
        rerenderMermaid();
      });
    }
    function initTocState(hook) {
      hook.doneEach(function () { applyToc(tocMode()); });
    }
    function initHomeActive(hook) {
      hook.doneEach(function () {
        var hash = window.location.hash;
        var isHome = !hash || hash === '#' || hash === '#/' || hash === '#/?id=';
        document.querySelectorAll('.sidebar-nav a').forEach(function (a) {
          var href = a.getAttribute('href');
          if (href === '#/' || href === '#' || href === '/') {
            var li = a.closest('li');
            if (li) {
              if (isHome) li.classList.add('active');
              else li.classList.remove('active');
            }
          }
        });
      });
    }
    function updateTitle(hook) {
      hook.doneEach(function () {
        var h1 = document.querySelector('.markdown-section h1');
        var base = 'splunkctl';
        var full = base + ' — Splunk MCP Server and CLI for SIEM and SOAR';
        var page = h1 ? h1.textContent.trim() : '';
        document.title = (page && page !== base)
          ? page + ' — ' + base
          : full;
      });
    }
    function wrapTables(hook) {
      hook.doneEach(function () {
        document.querySelectorAll('.markdown-section table').forEach(function (t) {
          if (t.parentElement.classList.contains('table-wrap')) return;
          var wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          t.parentNode.insertBefore(wrap, t);
          wrap.appendChild(t);
        });
      });
    }
    window.$docsify = window.$docsify || {};
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(initMermaid, initTocState, initHomeActive, updateTitle, wrapTables);
  </script>
  <script>
    function sysDark() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    function themeMode() {
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') return t; } catch (e) {}
      return sysDark() ? 'dark' : 'light';
    }
    function applyTheme(m) {
      document.documentElement.setAttribute('data-theme', m);
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = (m === 'dark' ? '☾' : '☀') + ' ' + (m === 'dark' ? 'Dark' : 'Light');
    }
    function tocMode() {
      try { var v = localStorage.getItem('toc'); if (v === 'visible') return v; } catch (e) {}
      return 'hidden';
    }
    function applyToc(v) {
      var toc = document.querySelector('.page_toc');
      var btn = document.getElementById('toc-toggle');
      if (toc) {
        if (v === 'hidden') { toc.classList.add('hidden'); document.documentElement.classList.add('toc-hidden'); }
        else { toc.classList.remove('hidden'); document.documentElement.classList.remove('toc-hidden'); }
      }
      if (btn) btn.textContent = v === 'hidden' ? 'TOC ▸' : 'TOC ◂';
    }
    function fontMode() {
      try { var f = localStorage.getItem('font'); if (f === 'mono') return f; } catch (e) {}
      return 'readable';
    }
    function applyFont(f) {
      if (f === 'mono') document.documentElement.removeAttribute('data-font');
      else document.documentElement.setAttribute('data-font', 'readable');
      var btn = document.getElementById('font-toggle');
      if (btn) btn.textContent = f === 'mono' ? 'Mono' : 'Sans';
    }
    applyTheme(themeMode());
    applyFont(fontMode());
    document.addEventListener('DOMContentLoaded', function () {
      applyTheme(themeMode());
      applyFont(fontMode());
      applyToc(tocMode());
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var next = themeMode() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyTheme(next);
        rerenderMermaid();
      });
      document.getElementById('font-toggle').addEventListener('click', function () {
        var next = fontMode() === 'readable' ? 'mono' : 'readable';
        try { localStorage.setItem('font', next); } catch (e) {}
        applyFont(next);
      });
      document.getElementById('toc-toggle').addEventListener('click', function () {
        var next = tocMode() === 'hidden' ? 'visible' : 'hidden';
        try { localStorage.setItem('toc', next); } catch (e) {}
        applyToc(next);
      });
    });
  </script>
</body>
</html>
