<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B3A2D"/>
      <stop offset="100%" stop-color="#0D1F17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#65D26E"/>
      <stop offset="100%" stop-color="#3A9E45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <!-- Magnifying glass + terminal icon -->
  <g transform="translate(80,50)">
    <circle cx="85" cy="85" r="60" stroke="url(#accent)" stroke-width="10" fill="none" opacity="0.9"/>
    <line x1="127" y1="127" x2="175" y2="175" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <text x="85" y="100" font-family="monospace" font-size="42" fill="#65D26E" text-anchor="middle" font-weight="700">&gt;_</text>
  </g>
  <!-- Title -->
  <text x="290" y="135" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="82" font-weight="800" fill="white" letter-spacing="-2">splunkctl</text>
  <!-- Subtitle -->
  <text x="290" y="185" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" fill="#A3D9A5" letter-spacing="0.5">Operate Splunk Enterprise as code</text>
  <!-- Stats pills -->
  <g transform="translate(290,215)">
    <rect width="140" height="34" rx="17" fill="white" opacity="0.15"/>
    <text x="70" y="23" font-family="system-ui,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">20+ groups</text>
    <rect x="155" width="130" height="34" rx="17" fill="white" opacity="0.15"/>
    <text x="220" y="23" font-family="system-ui,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Python + Click</text>
    <rect x="300" width="155" height="34" rx="17" fill="white" opacity="0.15"/>
    <text x="377" y="23" font-family="system-ui,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">config-as-code</text>
    <rect x="470" width="160" height="34" rx="17" fill="white" opacity="0.15"/>
    <text x="550" y="23" font-family="system-ui,sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">agent-first design</text>
  </g>
</svg>
