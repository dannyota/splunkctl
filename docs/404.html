<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting — splunkctl</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <script>
    var path = location.pathname;
    if (path.length > 1) {
      location.replace('/#' + path + location.search);
    } else {
      location.replace('/');
    }
  </script>
  <style>
    body { margin: 0; padding: 40px 24px; font: 16px/26px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; background: #F8FAFC; }
    a { color: #166534; }
    @media (prefers-color-scheme: dark) { body { color: #F8FAFC; background: #111827; } a { color: #86EFAC; } }
  </style>
</head>
<body>
  <p>Redirecting to the documentation. If nothing happens, open <a href="/">splunkctl.danny.vn</a>.</p>
</body>
</html>
