name: Publish to PyPI

# Publishes splunkctl to PyPI via Trusted Publishing (OIDC) — no API token
# stored as a secret.
#
# ONE-TIME SETUP (PyPI side):
#   https://pypi.org/manage/project/splunkctl/settings/publishing/ -> Add a
#   trusted publisher with EXACTLY:
#     Owner:            dannyota
#     Repository name:  splunkctl
#     Workflow name:    publish.yml
#     Environment name: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/splunkctl/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
