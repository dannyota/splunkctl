name: Publish to PyPI

# Publishes splunkctl to PyPI via Trusted Publishing (OIDC) — no API token
# stored as a secret.
#
# ONE-TIME SETUP (PyPI side):
#   https://pypi.org/manage/project/splunkctl/settings/publishing/ -> Add a
#   trusted publisher with EXACTLY:
#     Owner:            dannyota
#     Repository name:  splunkctl
#     Workflow name:    publish.yml
#     Environment name: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/splunkctl/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
