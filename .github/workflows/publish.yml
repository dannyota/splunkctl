name: Publish to PyPI

# Publishes splunkctl to PyPI via Trusted Publishing (OIDC) — no API token
# stored as a secret.
#
# ONE-TIME SETUP (PyPI side):
#   https://pypi.org/manage/project/splunkctl/settings/publishing/ -> Add a
#   trusted publisher with EXACTLY:
#     Owner:            dannyota
#     Repository name:  splunkctl
#     Workflow name:    publish.yml
#     Environment name: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/splunkctl/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check release version
        run: |
          version="$(python -c "import splunkctl; print(splunkctl.__version__)")"
          [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo "Release tag does not match package version $version" >&2; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
