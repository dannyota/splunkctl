name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: mypy splunkctl/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q

  # Install the BUILT WHEEL in a clean env and import the full command
  # tree — a hardcoded package list once shipped wheels missing
  # splunkctl.commands.soar (v0.7.0–v0.10.0) that only editable
  # installs concealed.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      - run: pip install dist/*.whl
      - run: splunkctl --version
      - run: splunkctl commands --json > /dev/null
      - run: splunkctl soar playbooks --help > /dev/null
      - name: Check MCP guides in a relocated user install
        run: |
          userbase="$(mktemp -d)"
          PYTHONUSERBASE="$userbase" python -m pip install --user --no-deps --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          PYTHONUSERBASE="$userbase" python - <<'PY'
          import os
          from pathlib import Path

          import splunkctl
          from splunkctl.mcp.resources import load_guides

          userbase = Path(os.environ["PYTHONUSERBASE"]).resolve()
          package = Path(splunkctl.__file__).resolve()
          assert package.is_relative_to(userbase), (package, userbase)
          guides = load_guides()
          assert len(guides) == 36, f"expected 36 packaged guides, found {len(guides)}"
          PY

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/secrets

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: bash scripts/check-lengths.sh
      - run: bash scripts/gen-seo.sh --check
      # Command-reference freshness: docs/commands/ + the sidebar block must
      # match the committed command tree (regenerate with `splunkctl docs generate`).
      - run: splunkctl docs generate --check
