[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splunkctl"
dynamic = ["version"]
description = "Open-source MCP server and CLI for Splunk Enterprise SIEM and Splunk SOAR."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "dannyota" }]
keywords = ["splunk", "mcp", "model-context-protocol", "siem", "soar", "security", "cli", "detection", "spl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "splunk-sdk>=2.0",
    "click>=8.2",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "requests>=2.32",
    "defusedxml>=0.7",
    "mcp>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
    "types-tabulate",
    "types-defusedxml",
]

[project.scripts]
splunkctl = "splunkctl.main:cli"

[project.urls]
Homepage = "https://github.com/dannyota/splunkctl"
Repository = "https://github.com/dannyota/splunkctl"
Issues = "https://github.com/dannyota/splunkctl/issues"

# Auto-discover subpackages — a hardcoded list silently dropped
# splunkctl.commands.soar from every wheel (v0.7.0–v0.10.0).
[tool.setuptools.packages.find]
include = ["splunkctl*"]

[tool.setuptools.dynamic]
version = { attr = "splunkctl.__version__" }

[tool.setuptools.package-data]
"splunkctl.mcp" = ["py.typed"]

# --- Ruff (lint + format) ---

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
]
ignore = [
    "D100", # missing module docstring
    "D104", # missing public package docstring
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "D"]

# --- mypy (strict) ---

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "splunklib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
